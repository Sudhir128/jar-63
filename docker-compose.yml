services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jar63}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jar63}
      POSTGRES_DB: ${POSTGRES_DB:-jar63}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jar63} -d ${POSTGRES_DB:-jar63}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jar63-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jar63-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jar63}:${POSTGRES_PASSWORD:-jar63}@postgres:5432/${POSTGRES_DB:-jar63}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    networks:
      - jar63-net

volumes:
  postgres_data:
  redis_data:

networks:
  jar63-net:
    driver: bridge
