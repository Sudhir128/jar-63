[project]
name = "jar-63"
version = "0.1.0"
description = "JAR-63 — a modular personal AI operating system (foundation)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "JAR-63" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "redis>=5.2",
    "loguru>=0.7",
    "anyio>=4.6",
    "typing-extensions>=4.12",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx2>=2.9",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]
# Reserved for later phases — not installed yet.
llm = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
]

[project.urls]
Documentation = "https://github.com/jar-63/jar-63/blob/main/docs/architecture.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
markers = [
    "ollama: optional integration tests requiring a real Ollama server/model (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
